services:
  db:
    image: mysql:8.0
    container_name: kantin_db_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kantin_db
    ports:
      - "3306:3306"
    volumes:
      - ./kantin_db.sql:/docker-entrypoint-initdb.d/kantin_db.sql
      - mysql_data:/var/lib/mysql

  web:
    image: masruraffandi/kantin-flask:v1
    container_name: kantin_web_container
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: kantin_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  mysql_data: